<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#4a6cf7">
<title>译词通 - 英汉翻译 · 自动生词本</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css?v=12">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
</head>
<body>
<header>
  <h1>译词通</h1>
  <p class="sub">英汉互译 · 自动生词本 · 完全离线</p>
</header>

<nav class="tabs">
  <button id="tab-translate" class="tab active">翻译</button>
  <button id="tab-vocab" class="tab">生词本 <span id="vocab-count" class="badge">0</span></button>
</nav>

<main>
  <!-- 翻译页 -->
  <section id="page-translate" class="page active">
    <div class="lang-switch">
      <button id="lang-en2zh" class="lang-btn active">英 → 汉</button>
      <button id="lang-zh2en" class="lang-btn">汉 → 英</button>
    </div>
    <div class="flow-hint">翻译顺序：🏠 自建引擎 → 🌐 免费接口 → ⚡ 离线词典</div>
    <div class="input-box">
      <!-- 不加 autofocus：手机上会自动弹出键盘挡住半屏，用户还没看清界面就被键盘顶开 -->
      <textarea id="src" rows="3" placeholder="输入英文单词或句子，回车翻译…" enterkeyhint="go" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
      <div class="input-actions">
        <button id="btn-clear" title="清空">✕</button>
        <button id="btn-go" class="primary">翻译</button>
      </div>
    </div>
    <div id="result" class="result hidden">
      <div class="result-head">
        <span id="result-src"></span>
        <button id="btn-speak" title="朗读">🔊</button>
      </div>
      <div id="result-text" class="result-text"></div>
      <div id="result-dict" class="result-dict"></div>
      <div id="saved-tip" class="saved-tip">✓ 已自动加入生词本</div>
    </div>
    <div id="history-block" class="history-block hidden">
      <h3>最近查询</h3>
      <div id="history-list" class="chips"></div>
    </div>
  </section>

  <!-- 生词本页 -->
  <section id="page-vocab" class="page">
    <div class="vocab-toolbar">
      <input id="vocab-search" type="search" placeholder="搜索生词本…">
      <button id="btn-export">导出</button>
      <button id="btn-clear-vocab" class="danger">清空</button>
    </div>
    <ul id="vocab-list" class="vocab-list"></ul>
    <p id="vocab-empty" class="empty">生词本还是空的，去翻译点什么吧～</p>
  </section>
</main>

<footer>数据仅保存在本设备 · 支持离线安装</footer>

<script src="dict.js?v=12"></script>
<script src="cn-dict.js?v=12"></script>
<script src="app.js?v=12"></script>
</body>
</html>
